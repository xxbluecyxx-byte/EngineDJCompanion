name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK Platform 36
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EngineDJCompanion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload verification reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EngineDJCompanion-verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  prime-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prime-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false

      - name: Resolve pinned modules
        run: go mod tidy

      - name: Test agent
        run: go test ./...

      - name: Build Prime 4+ ARMv7 agent
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
        run: |
          go build -trimpath -ldflags="-s -w" -o engine-companion-agent .
          sha256sum engine-companion-agent > engine-companion-agent.sha256

      - name: Upload Prime agent
        uses: actions/upload-artifact@v4
        with:
          name: EngineCompanion-Prime-agent-armv7
          path: |
            prime-agent/engine-companion-agent
            prime-agent/engine-companion-agent.sha256
            prime-agent/engine-companion-agent.service
          retention-days: 14
          if-no-files-found: error
